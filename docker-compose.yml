# ============================================================
# 一键起全套服务：MySQL + Redis + RabbitMQ + 后端 + 管理后台
#
#   docker compose up -d --build          # 首次构建并启动
#   docker compose logs -f backend        # 看后端日志
#   docker compose down                   # 停止（数据保留在 volume 里）
#   docker compose down -v                # 连数据一起删
#
# 只想要中间件（本地跑后端连它们）：
#   docker compose up -d mysql redis rabbitmq
#
# 只想要监控面板（后端已在本地 8080 跑）：
#   需要把 deploy/prometheus/prometheus.yml 里的 targets 改成
#   host.docker.internal:8080 后再执行 docker compose up -d prometheus grafana
#
# 注意：MySQL / Redis / RabbitMQ 的 5672 端口没有映射到宿主机，
# 这样不会和你本机已经在跑的 3306 / 6379 / 5672 冲突。
# 对外开放的端口：8081 管理后台、8080 后端、15672 MQ 管理台、9090 Prometheus、3000 Grafana。
# ============================================================

name: seckill-platform

services:
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据目录为空（第一次启动）时执行，灌入演示商品/用户/活动；
      # 想要空库就把这一行注释掉
      - ./seckill-backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7
    container_name: seckill-redis
    restart: unless-stopped
    # appendonly 打开持久化：容器重启后库存 key 不会凭空消失
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: seckill-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      # 只暴露管理台，AMQP 端口留给容器网络内部使用
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./seckill-backend
    container_name: seckill-backend
    restart: unless-stopped
    environment:
      # application.yml 里用这些变量覆盖默认的 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "123456"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      # JWT 密钥必须够长（HS256 要求 32 字节以上），生产环境请换成随机值
      JWT_SECRET: seckill-platform-docker-dev-secret-key-2026-32bytes
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: seckill-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # 指标只留 7 天，本地演示够用，也不至于把磁盘吃满
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    container_name: seckill-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      # 数据源与面板通过 provisioning 自动加载，启动即可看到「秒杀平台监控」
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  admin:
    build:
      context: ./seckill-admin
    container_name: seckill-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
