# 测试专用配置：与开发环境隔离，避免测试数据污染演示库
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/seckill_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      # 用 15 号库，和开发环境的 0 号库分开
      database: 15
  rabbitmq:
    listener:
      simple:
        # 测试里不发真实消息（RabbitTemplate 被 mock），也别让消费者抢走开发环境的消息
        auto-startup: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql

mybatis-plus:
  configuration:
    # 测试时关掉 SQL 打印，日志太吵
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.seckill: warn
