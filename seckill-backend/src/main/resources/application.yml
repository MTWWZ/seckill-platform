server:
  port: 8080

spring:
  application:
    name: seckill-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

mybatis-plus:
  # 开启驼峰映射：数据库 shop_id <-> 实体 shopId
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，方便排查问题；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：deleted = 1 表示已删除，查询会自动过滤
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 自定义 XML 的存放位置（复杂 SQL 写在这里）
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  # 签名密钥（生产环境请用环境变量注入，不要硬编码）
  secret: ${JWT_SECRET:seckill-platform-dev-secret-key-change-me-in-production-2026}
  # token 有效期（分钟）
  expire-minutes: 120
  # 前端携带 token 的请求头名称
  header: Authorization

logging:
  level:
    com.seckill: debug
