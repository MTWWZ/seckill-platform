server:
  port: 8080

spring:
  application:
    name: seckill-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  # Flyway：启动时自动执行 db/migration 下未应用过的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 项目早期用 init.sql 手工建过表，没有版本记录；
    # 基线设为 0 再执行 V1（V1 里是 CREATE TABLE IF NOT EXISTS，对已有表是幂等的）
    baseline-on-migrate: true
    baseline-version: 0
  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 发送确认：消息到达交换机后回调，能发现"消息没送出去"
    publisher-confirm-type: correlated
    # 路由失败（找不到队列）时把消息退回
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK：业务处理成功才确认消息，避免消息丢失
        acknowledge-mode: manual
        # 一次预取 20 条，限制单个消费者的内存占用
        prefetch: 20

mybatis-plus:
  # 开启驼峰映射：数据库 shop_id <-> 实体 shopId
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，方便排查问题；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：deleted = 1 表示已删除，查询会自动过滤
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 自定义 XML 的存放位置（复杂 SQL 写在这里）
  mapper-locations: classpath*:/mapper/**/*.xml

# 秒杀业务参数
seckill:
  order:
    # 订单超时时长（分钟）：延迟队列的 TTL 与定时补偿任务都读这个值
    # 注意：队列 TTL 是声明时写进 Broker 的，改完要先删掉旧队列才会生效
    timeout-minutes: 15

# JWT 配置
jwt:
  # 签名密钥（生产环境请用环境变量注入，不要硬编码）
  secret: ${JWT_SECRET:seckill-platform-dev-secret-key-change-me-in-production-2026}
  # token 有效期（分钟）
  expire-minutes: 120
  # 前端携带 token 的请求头名称
  header: Authorization

logging:
  level:
    com.seckill: debug

# 监控（Actuator）
management:
  endpoints:
    web:
      exposure:
        # 生产环境不要这么开放，至少要用鉴权保护 /actuator/**
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 默认只暴露 summary，没有 _bucket，Grafana 就算不出 P95；
      # 打开直方图后会有 http_server_requests_seconds_bucket
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
