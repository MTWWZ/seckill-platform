server:
  port: 8080

spring:
  application:
    name: seckill-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 发送确认：消息到达交换机后回调，能发现"消息没送出去"
    publisher-confirm-type: correlated
    # 路由失败（找不到队列）时把消息退回
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK：业务处理成功才确认消息，避免消息丢失
        acknowledge-mode: manual
        # 一次预取 20 条，限制单个消费者的内存占用
        prefetch: 20

mybatis-plus:
  # 开启驼峰映射：数据库 shop_id <-> 实体 shopId
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，方便排查问题；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：deleted = 1 表示已删除，查询会自动过滤
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 自定义 XML 的存放位置（复杂 SQL 写在这里）
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  # 签名密钥（生产环境请用环境变量注入，不要硬编码）
  secret: ${JWT_SECRET:seckill-platform-dev-secret-key-change-me-in-production-2026}
  # token 有效期（分钟）
  expire-minutes: 120
  # 前端携带 token 的请求头名称
  header: Authorization

logging:
  level:
    com.seckill: debug

# 监控（Actuator）
management:
  endpoints:
    web:
      exposure:
        # 生产环境不要这么开放，至少要用鉴权保护 /actuator/**
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
